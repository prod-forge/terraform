name: Terraform CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.2
      - run: terraform fmt -check -recursive

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Replace `infrastructure` with environments/dev and environments/prod once they exist.
        root: [bootstrap, infrastructure]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.2
      - id: init
        run: terraform init -backend=false -lockfile=readonly
        working-directory: ${{ matrix.root }}
      - run: terraform validate
        working-directory: ${{ matrix.root }}
      # Offline: every run uses mock providers with command = plan.
      - if: ${{ !cancelled() && steps.init.outcome == 'success' && matrix.root == 'infrastructure' }}
        run: terraform test
        working-directory: ${{ matrix.root }}

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.65.0
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure
          config_file: .checkov.yaml
          soft_fail: false

  terraform-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install terraform-docs
        run: |
          curl -sSLo terraform-docs.tar.gz https://github.com/terraform-docs/terraform-docs/releases/download/v0.24.0/terraform-docs-v0.24.0-linux-amd64.tar.gz
          tar -xzf terraform-docs.tar.gz terraform-docs
          sudo mv terraform-docs /usr/local/bin/
          terraform-docs --version
      - name: Regenerate module docs
        run: |
          for d in $(find infrastructure/modules -name '*.tf' -exec dirname {} \; | sort -u); do
            terraform-docs -c "$PWD/.terraform-docs.yml" "$d"
          done
      - name: Fail on docs diff
        run: |
          status=$(git status --porcelain -- infrastructure/modules)
          if [ -n "$status" ]; then
            echo "$status"
            exit 1
          fi
